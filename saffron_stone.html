<h2 style="margin-top:2rem">${tr('Reservations','الحجوزات')}</h2><div style="overflow-x:auto"><table><tr><th>${tr('Guest','الضيف')}</th><th>${tr('Party','العدد')}</th><th>${tr('Time','الوقت')}</th><th>${tr('Status','الحالة')}</th><th>${tr('Table','الطاولة')}</th><th></th></tr>${RL.filter(r=>r.st!='Cancelled').map(r=>`<tr><td>${tS(r.name)}</td><td>${r.n}</td><td>${r.t}</td><td>${tS(r.st)}</td><td>${r.tb?'T'+r.tb:tr('None','بدون')}</td><td>${r.st=='Arrived'?'':`<button class="btn sm ghost" onclick="asg(${r.id})">${r.tb?tr('Mark arrived','تسجيل الوصول'):tr('Assign table','تعيين طاولة')}</button>`}</td></tr>`).join('')}</table></div>`}
function asg(id){const r=RL.find(x=>x.id==id);if(r.tb){r.st='Arrived';TB[r.tb-1].s=2;TB[r.tb-1].t=now();toast(L=='ar'?`تم إجلاس ${tS(r.name)} على طاولة T${r.tb}`:r.name+' seated at T'+r.tb)}else{const t=TB.filter(t=>t.s==0&&t.c>=r.n).sort((a,b)=>a.c-b.c)[0];if(!t){toast(L=='ar'?`لا توجد طاولة متاحة تتسع لـ ${r.n}. قم بإخلاء طاولة أولاً.`:'No free table seats '+r.n+'. Free one up first.');return}t.s=1;r.tb=t.n;r.st='Confirmed';toast(L=='ar'?`تم تعيين طاولة T${t.n} (تتسع لـ ${t.c})`:'Assigned T'+t.n+' (seats '+t.c+')')}render()}
setInterval(()=>{document.querySelectorAll('.tm').forEach(e=>{const s=Math.floor((now()-e.dataset.t)/1000),m=Math.floor(s/60);e.textContent=e.dataset.m?m+tr(' min',' د'):String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0');e.classList.toggle('late',!e.dataset.m&&m>=10);if(!e.dataset.m&&m>=10&&!e.textContent.includes(tr('Late','متأخر')))e.textContent+=' '+tr('Late','متأخر')})},1000);
setInterval(()=>{hi++;if(V=='home'&&!AM)plate()},4200);setInterval(()=>{if(V=='home'&&!AM)revT()},4000);
setInterval(()=>{if(O.length<22){const d1=D.filter(d=>d.a),n=1+Math.floor(Math.random()*3),its=[...Array(n)].map(()=>{const d=d1[Math.floor(Math.random()*d1.length)];return{n:d.n,p:d.p,q:1+(Math.random()>.7)}}),o=mk(its,['Pickup','Delivery','Dine-in'][Math.floor(Math.random()*3)],NAMES[Math.floor(Math.random()*8)]);O.unshift(o);if(AM&&(AV=='ord'||AV=='ov'))render();if(AM)toast(L=='ar'?`طلب جديد #${o.id} من ${tS(o.nm)}`:'New order #'+o.id+' from '+o.nm)}},14000);
setInterval(()=>{if(mine&&mine.st<4&&now()-mine.lc>9000){mine.st++;mine.lc=now();if(!AM&&V=='track')render();if(AM&&AV=='ord')render()}},3000);
let SE='Summer',DK=0;
const SEAS={Spring:{ids:[4,1],t:'Green, bright, barely cooked',ta:'خضراء، مشرقة، ومطهوة بخفة',d:'Young herbs, early tomatoes and the first lemons. Dishes stay light and sharp.',da:'أعشاب غضة، طماطم مبكرة وأولى ثمار الليمون. أطباق خفيفة ومنعشة.'},Summer:{ids:[9,1],t:'Cold drinks and ripe tomatoes',ta:'مشروبات باردة وطماطم ناضجة',d:'Heirlooms at their peak, mint everywhere, hibiscus on ice.',da:'طماطم هيرلوم في ذروة نضجها، نعناع في كل مكان، وكركديه مثلج.'},Autumn:{ids:[5,8],t:'Smoke, honey and warm spice',ta:'دخان، عسل وتوابل دافئة',d:'The grill works harder. Pomegranate, walnuts and orange blossom arrive.',da:'تزداد حرارة الشواية. يصل الرمان وعين الجمل وزهر البرتقال.'},Winter:{ids:[6,7],t:'Slow and rich',ta:'طهي بطيء وغني',d:'Eight-hour lamb, saffron jus and pistachio desserts for long dinners.',da:'لحم ضأن مطهو لثماني ساعات، عصارة الزعفران وحلويات الفستق لأمسيات العشاء الطويلة.'}};
const DAY=[['06:00','Market run','Chef Layla picks herbs, tomatoes and fish at the market before it gets hot.','جولة السوق','تختار الشيف ليلى الأعشاب والطماطم والأسماك من السوق قبل اشتداد الحرارة.'],['11:00','Stone oven lit','The oven climbs past 400°C while the lamb finishes its eight-hour roast.','إشعال الفرن الحجري','تتجاوز حرارة الفرن 400 درجة مئوية بينما يكمل لحم الضأن طهيه لثماني ساعات.'],['12:00','Doors open','First orders go out. Pickup is usually ready in 15 minutes.','فتح الأبواب','تخرج الطلبات الأولى. عادة ما يكون الاستلام جاهزاً خلال 15 دقيقة.'],['19:00','Dinner rush','Every table turns twice. The pass is loud and the grill never cools.','ذروة العشاء','تمتلئ كل طاولة مرتين. يضج المطبخ بالحركة ولا تهدأ الشواية أبداً.'],['00:00','Last orders','Dessert, mint tea and the quiet part of the night.','الطلبات الأخيرة','الحلويات، شاي النعناع، والجزء الهادئ من الليل.']];
function season(){const b=$('#sbody');if(!b)return;$('#sch').innerHTML=Object.keys(SEAS).map(k=>`<button class="c ${k==SE?'on':''}" onclick="SE='${k}';season()">${tS(k)}</button>`).join('');const s=SEAS[SE];b.innerHTML=`<div><h3 class="serif" style="font-size:2rem">${L=='ar'?s.ta:s.t}</h3><p class="mut">${L=='ar'?s.da:s.d}</p></div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${s.ids.map(i=>card(D.find(d=>d.id==i))).join('')}</div>`}
function dayK(){const c=$('#dkc');if(!c)return;c.innerHTML=DAY.map((x,i)=>`<button class="c ${i==DK?'on':''}" onclick="DK=${i};dayK()">${x[0]}</button>`).join('');$('#dkb').innerHTML=`<b>${L=='ar'?DAY[DK][3]:DAY[DK][1]}.</b> ${L=='ar'?DAY[DK][4]:DAY[DK][2]}`}
function est(){const g=+$('#gs').value;$('#gv').textContent=g;$('#estout').textContent=E(g*650);$('#esth').textContent=g<=20?tr('Suits the Stone Room, seats up to 20.','يناسب القاعة الحجرية، تتسع حتى 20 ضيفاً.'):g<=45?tr('Suits the Terrace, seats up to 45.','يناسب التراس، يتسع حتى 45 ضيفاً.'):tr('This needs a full venue buyout.','يتطلب هذا حجز المطعم بالكامل.')}
function sub(){const v=$('#nl').value.trim();if(!/^\S+@\S+\.\S+$/.test(v)){$('#nle').textContent=tr('Enter a valid email, like name@example.com.','أدخل بريداً إلكترونياً صحيحاً، مثل name@example.com.');return}$('#nlb').innerHTML=`<h2>${tr('You’re on the list','أنت الآن في القائمة')}</h2><p class="mut">${L=='ar'?'سنرسل بريداً إلى '+v.replace(/</g,'')+' عندما تجهز القائمة القادمة.':'We’ll email '+v.replace(/</g,'')+' when the next menu is ready.'}</p>`;toast(tr('Subscribed','تم الاشتراك'))}
function extras(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const el=e.target,to=+el.dataset.to,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1400),v=to*(1-Math.pow(1-p,3));el.textContent=to%1?v.toFixed(1):Math.round(v).toLocaleString('en-US');if(p<1)requestAnimationFrame(f)})(t0)}),{threshold:.5});document.querySelectorAll('.cnt').forEach(e=>io.observe(e));
const r=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('in')),{threshold:.12});document.querySelectorAll('.rv').forEach(e=>r.observe(e));season();dayK();est();
const p=$('#plate'),h=$('.hero');if(p&&h&&matchMedia('(hover:hover)').matches)h.onmousemove=ev=>{const b=p.getBoundingClientRect();p.style.transform=`translate(${(ev.clientX-b.left-b.width/2)/45}px,${(ev.clientY-b.top-b.height/2)/45}px)`}}
render();setTimeout(revT,50);
